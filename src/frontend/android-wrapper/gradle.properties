# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Calorieshivam Configuration
# This property controls the target web app URL for all environments
# Set this to your production canister URL before building the release APK
# Example: nutriscan.baseUrl=https://abc123-xyz.ic0.app
nutriscan.baseUrl=https://YOUR_CANISTER_ID.ic0.app

# Release Signing Configuration
# IMPORTANT: Do NOT commit signing credentials to version control
# Place these values in local.properties (which is gitignored) or use environment variables
# 
# Example local.properties entries:
# RELEASE_STORE_FILE=path/to/release.keystore
# RELEASE_STORE_PASSWORD=your_store_password
# RELEASE_KEY_ALIAS=your_key_alias
# RELEASE_KEY_PASSWORD=your_key_password
