# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# NutriScan Configuration
# Set this to your production canister URL before building for Play Store
# Example: nutriscan.baseUrl=https://abc123-xyz.ic0.app
nutriscan.baseUrl=https://YOUR_CANISTER_ID.ic0.app

# Release signing configuration (keep these in local.properties, not in version control)
# RELEASE_STORE_FILE=path/to/release.keystore
# RELEASE_STORE_PASSWORD=your_store_password
# RELEASE_KEY_ALIAS=your_key_alias
# RELEASE_KEY_PASSWORD=your_key_password
